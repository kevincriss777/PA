<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Store - Accesorios de Fórmula 1</title>
    <link rel="stylesheet" href="carrito.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">🏎️ COMPRA COMO CORRES </div>
            <button class="cart-button" onclick="scrollToCart()">
                Ver Carrito (<span id="cart-count">0</span>)
            </button>
        </nav>
    </header>

    <div class="container">
        <h1>Accesorios de Fórmula 1</h1>

        <div class="products" id="products">
           
        </div>

        <div class="cart-section">
            <h2>Tu Carrito</h2>
            <div id="cart-items">
                <div class="empty-cart">
                    <p>Tu carrito está vacío</p>
                </div>
            </div>
            <div class="total">
                <h3>Total: $<span id="total">0</span></h3>
                <button class="checkout-btn" onclick="checkout()">Comprar Ahora</button>
            </div>
        </div>
    </div>

    <script src="carrito.js"></script>
    
</body>
</html>
